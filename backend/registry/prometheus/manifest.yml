component:
  slug: prometheus
  name: Prometheus
  version: "2.55.0"
  category: monitoring
  description: "Система сбора метрик и мониторинга с открытым исходным кодом"
  source_url: "https://github.com/prometheus/prometheus/archive/refs/tags/v2.55.0.tar.gz"
  community_url: null
  documentation_url: "https://prometheus.io/docs/"
  build_method: go_build
  build_args:
    VERSION: "2.55.0"
    GO_VERSION: "1.23"
  dependencies:
    requires: []
    provides: [monitoring]
  ports:
    http: 9090
  default_env:
    TZ: Europe/Moscow
  security:
    basic:
      read_only: false
      cap_drop: []
      no_new_privileges: false
    standard:
      read_only: true
      cap_drop: ["ALL"]
      cap_add: ["NET_BIND_SERVICE"]
      no_new_privileges: true
      healthcheck:
        test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/ready || exit 1"]
        interval: "30s"
        timeout: "10s"
        retries: 3
    hardened:
      read_only: true
      cap_drop: ["ALL"]
      no_new_privileges: true
      security_opt: ["seccomp:default", "no-new-privileges:true"]
      healthcheck:
        test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/ready || exit 1"]
        interval: "30s"
        timeout: "10s"
        retries: 3
