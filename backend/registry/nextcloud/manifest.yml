component:
  slug: nextcloud
  name: Nextcloud
  version: "30.0.0"
  category: file-storage
  description: "Безопасное облачное хранилище для корпоративного использования"
  source_url: "https://download.nextcloud.com/server/releases/nextcloud-30.0.0.tar.bz2"
  community_url: "https://github.com/nextcloud/server"
  documentation_url: "https://docs.nextcloud.com/"
  build_method: php_extract
  build_args:
    VERSION: "30.0.0"
  dependencies:
    requires: [database]
    provides: [file-storage, cloud]
  ports:
    http: 8080
  default_env:
    NEXTCLOUD_ADMIN_USER: admin
    NEXTCLOUD_ADMIN_PASSWORD: admin
    TZ: Europe/Moscow
  security:
    basic:
      read_only: false
      cap_drop: []
      no_new_privileges: false
    standard:
      read_only: true
      cap_drop: ["ALL"]
      cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
      no_new_privileges: true
      healthcheck:
        test: ["CMD-SHELL", "curl -f http://localhost/status.php || exit 1"]
        interval: "30s"
        timeout: "10s"
        retries: 3
    hardened:
      read_only: true
      cap_drop: ["ALL"]
      cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
      no_new_privileges: true
      security_opt: ["seccomp:default", "no-new-privileges:true"]
      healthcheck:
        test: ["CMD-SHELL", "curl -f http://localhost/status.php || exit 1"]
        interval: "30s"
        timeout: "10s"
        retries: 3
