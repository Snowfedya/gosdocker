events {
    worker_connections 1024;
}

http {
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # AC-INF-2: Docker embedded DNS resolver. Without this, upstream
    # hostnames (backend/frontend) are resolved ONCE at nginx startup
    # and cached. When the target container is recreated and gets a
    # new IP, nginx keeps hitting the old IP → 502 Bad Gateway.
    # Setting resolver + a variable forces re-resolution on every
    # request. valid=10s is a safe balance between freshness and
    # DNS query load.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name gosdocker.ru www.gosdocker.ru;
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name gosdocker.ru www.gosdocker.ru;

        ssl_certificate /etc/ssl/gosdocker.ru/fullchain.pem;
        ssl_certificate_key /etc/ssl/gosdocker.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Rate limiting for general traffic
        limit_req zone=general burst=50 nodelay;
        limit_conn addr 100;

        # AC-INF-2: use $backend/frontend variables to force runtime DNS
        location / {
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api {
            # Stricter rate limiting for API
            limit_req zone=api burst=20 nodelay;
            limit_conn addr 20;

            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 50m;
        }
    }
}
