services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - COSIGN_PASSWORD=${COSIGN_PASSWORD}
      - REGISTRY_HOST_PATH=/opt/gosdocker/backend/registry
    volumes:
      - ./backend/registry:/app/registry:ro
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /tmp/gosdocker-constructor:/tmp/gosdocker-constructor:rw
      - /tmp/gosdocker-reports:/tmp/gosdocker-reports:rw
      - syft_cache:/root/.syft
      - trivy_cache:/root/.cache/trivy
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gosdocker
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - gosdocker

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl/fullchain.pem:/etc/ssl/gosdocker.ru/fullchain.pem:ro
      - ./nginx/ssl/privkey.pem:/etc/ssl/gosdocker.ru/privkey.pem:ro
    depends_on:
      - frontend
      - backend
    networks:
      - gosdocker
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=gosdocker
      - POSTGRES_USER=gosdocker
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - gosdocker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gosdocker"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

volumes:
  pgdata:
  syft_cache:
  trivy_cache:

networks:
  gosdocker:
    driver: bridge